name: Update Plugin Catalog

on:
  push:
    branches: ["main"]
    paths:
      - "sources.json"
      - "scripts/build_catalog.py"
      - ".github/workflows/update-catalog.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4

      - name: Build repository.json from latest plugin releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_catalog.py

      - name: Commit and push updated repository.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update plugin catalog"
            git push
          fi
